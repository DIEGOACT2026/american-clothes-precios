<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Calculador de Precios - American Clothes</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px}.container{max-width:600px;margin:0 auto;background:white;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,0.3);overflow:hidden}.header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;padding:30px;text-align:center}.header h1{font-size:26px;margin-bottom:5px}.header p{font-size:13px;opacity:0.9}.content{padding:30px}.login-screen{display:none}.login-screen.active{display:block}.admin-screen{display:none}.admin-screen.active{display:block}.employee-screen{display:none}.employee-screen.active{display:block}.role-badge{display:inline-block;background:#4CAF50;color:white;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:20px}.employee-badge{display:inline-block;background:#2196F3;color:white;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:20px}.form-group{margin-bottom:15px}.form-group label{display:block;font-size:13px;font-weight:600;color:#333;margin-bottom:8px;text-transform:uppercase}.form-group input,.form-group select{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:6px;font-size:14px}.form-group input:focus,.form-group select:focus{outline:none;border-color:#667eea}button{padding:12px 20px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;width:100%;margin-bottom:10px;transition:transform 0.2s,box-shadow 0.2s}button:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(102,126,234,0.4)}button.secondary{background:#f0f0f0;color:#333}button.secondary:hover{background:#e0e0e0}button.danger{background:#f44336}.admin-section{margin-bottom:30px;padding:20px;background:#f8f9fa;border-radius:8px;border-left:4px solid #667eea}.admin-section h3{margin-bottom:15px;color:#333;font-size:16px}.params-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.param-input{display:flex;flex-direction:column}.param-input label{font-size:12px;font-weight:600;color:#666;margin-bottom:6px;text-transform:uppercase}.param-input input{padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px}.status-message{padding:12px;border-radius:6px;font-size:13px;margin-bottom:20px;display:none}.status-message.success{background:#c8e6c9;color:#2e7d32;display:block}.calculator-box{background:#f8f9fa;padding:25px;border-radius:8px;margin-bottom:20px}.result-box{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;padding:25px;border-radius:8px;text-align:center;display:none}.result-box.active{display:block}.result-box .price-value{font-size:48px;font-weight:700;margin-bottom:15px}.params-display{background:white;padding:15px;border-radius:6px;margin-bottom:20px;border:1px solid #e0e0e0;font-size:12px}.params-display p{margin-bottom:8px;color:#666}.footer{padding:15px 30px;background:#f8f9fa;border-top:1px solid #e0e0e0;font-size:11px;color:#999;text-align:center}</style></head><body><div class="container"><div class="header"><h1>💰 Sistema de Precios</h1><p>American Clothes - USD → MXN</p></div><div class="login-screen active" id="loginScreen"><div class="content"><div class="form-group" style="margin-bottom:30px"><label>Selecciona tu rol:</label><select id="roleSelect" style="font-size:16px;padding:14px"><option value="">-- Elige una opción --</option><option value="admin">👨‍💼 Administrador</option><option value="employee">👥 Empleado</option></select></div><div id="adminLoginForm" style="display:none"><div class="form-group"><label>Contraseña:</label><input type="password" id="adminPassword"></div><button onclick="loginAdmin()">Acceder</button><button class="secondary" onclick="resetLogin()">Cancelar</button></div><div id="employeeLoginForm" style="display:none"><div style="background:#e3f2fd;padding:15px;border-radius:6px;text-align:center;color:#1565c0;font-size:14px;margin-bottom:20px">✓ Acceso libre</div><button onclick="loginEmployee()">Acceder</button><button class="secondary" onclick="resetLogin()">Cancelar</button></div></div></div><div class="admin-screen" id="adminScreen"><div class="content"><div class="role-badge">👨‍💼 Administrador</div><div id="statusMessage" class="status-message"></div><div class="admin-section"><h3>⚙️ Parámetros</h3><div class="params-grid"><div class="param-input"><label>Tipo de Cambio</label><input type="number" id="adminTipoCambio" step="0.01" value="19"></div><div class="param-input"><label>Impuesto (%)</label><input type="number" id="adminImpuesto" step="0.1" value="8"></div><div class="param-input"><label>Margen < $50 (%)</label><input type="number" id="adminMargen1" step="0.1" value="30"></div><div class="param-input"><label>Margen $50-$100 (%)</label><input type="number" id="adminMargen2" step="0.1" value="25"></div><div class="param-input"><label>Margen > $100 (%)</label><input type="number" id="adminMargen3" step="0.1" value="20"></div></div></div><button onclick="guardarParametros()">💾 Guardar</button><button class="danger" onclick="logout()">Salir</button></div></div><div class="employee-screen" id="employeeScreen"><div class="content"><div class="employee-badge">👥 Empleado</div><div class="params-display"><p>Dólar: <strong id="empDolar">$19.00</strong></p><p>Impuesto: <strong id="empImpuesto">8%</strong></p></div><div class="calculator-box"><div class="form-group"><label>Precio USD</label><input type="number" id="precioUSD" step="0.01" oninput="calcularPrecio()"></div><div class="form-group"><label>Descuento (%)</label><input type="number" id="descuento" step="0.1" min="0" max="100" oninput="calcularPrecio()"></div></div><div class="result-box" id="resultBox"><div>Precio de Venta</div><div class="price-value" id="precioFinal">$0.00</div></div><button onclick="logout()" class="danger">Salir</button></div></div><div class="footer">© 2024 American Clothes</div></div><script>const ADMIN_PASSWORD="american2024";let currentUser=null;let parametros={tipoCambio:19,impuesto:8,margen1:30,margen2:25,margen3:20};window.addEventListener('DOMContentLoaded',function(){cargarParametros();document.getElementById('roleSelect').addEventListener('change',function(e){document.getElementById('adminLoginForm').style.display=e.target.value==='admin'?'block':'none';document.getElementById('employeeLoginForm').style.display=e.target.value==='employee'?'block':'none'})});function cargarParametros(){const saved=localStorage.getItem('parametros_precios');if(saved){try{parametros=JSON.parse(saved)}catch(e){console.error('Error:',e)}}}function guardarParametros(){parametros.tipoCambio=parseFloat(document.getElementById('adminTipoCambio').value);parametros.impuesto=parseFloat(document.getElementById('adminImpuesto').value);parametros.margen1=parseFloat(document.getElementById('adminMargen1').value);parametros.margen2=parseFloat(document.getElementById('adminMargen2').value);parametros.margen3=parseFloat(document.getElementById('adminMargen3').value);localStorage.setItem('parametros_precios',JSON.stringify(parametros));const msg=document.getElementById('statusMessage');msg.textContent='✓ Guardado';msg.className='status-message success';setTimeout(()=>{msg.textContent=''},3000)}function loginAdmin(){if(document.getElementById('adminPassword').value===ADMIN_PASSWORD){currentUser='admin';mostrarPantalla('admin');document.getElementById('adminTipoCambio').value=parametros.tipoCambio;document.getElementById('adminImpuesto').value=parametros.impuesto;document.getElementById('adminMargen1').value=parametros.margen1;document.getElementById('adminMargen2').value=parametros.margen2;document.getElementById('adminMargen3').value=parametros.margen3}else{alert('Contraseña incorrecta')}}function loginEmployee(){currentUser='employee';mostrarPantalla('employee');actualizarEmpleado()}function logout(){currentUser=null;document.getElementById('roleSelect').value='';document.getElementById('adminLoginForm').style.display='none';document.getElementById('employeeLoginForm').style.display='none';document.getElementById('adminPassword').value='';mostrarPantalla('login')}function mostrarPantalla(p){document.getElementById('loginScreen').classList.remove('active');document.getElementById('adminScreen').classList.remove('active');document.getElementById('employeeScreen').classList.remove('active');document.getElementById(p+'Screen').classList.add('active')}function obtenerMargen(precio){if(precio<50)return parametros.margen1;if(precio<=100)return parametros.margen2;return parametros.margen3}function redondear(precio){const decimal=precio%1;const entero=Math.floor(precio);if(decimal<0.245||decimal<0.745)return entero+0.49;return entero+0.99}function calcularPrecio(){const usd=parseFloat(document.getElementById('precioUSD').value);const desc=parseFloat(document.getElementById('descuento').value);if(!usd||isNaN(desc)){document.getElementById('resultBox').classList.remove('active');return}const margen=obtenerMargen(usd)/100;let mxn=usd*parametros.tipoCambio*(1+parametros.impuesto/100);let final=mxn*(1+margen)*(1-desc/100);final=redondear(final);document.getElementById('precioFinal').textContent='$'+final.toFixed(2);document.getElementById('resultBox').classList.add('active')}function actualizarEmpleado(){document.getElementById('empDolar').textContent='$'+parametros.tipoCambio.toFixed(2);document.getElementById('empImpuesto').textContent=parametros.impuesto.toFixed(1)+'%';if(document.getElementById('precioUSD').value)calcularPrecio()}</script></body></html>
